plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.8.21'
}

group = 'com'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
kotlin {
    jvmToolchain(17)
}