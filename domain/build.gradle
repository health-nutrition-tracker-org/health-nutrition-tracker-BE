plugins {
    id 'org.jetbrains.kotlin.jvm' version "${kotlinVersion}"
}

group = "${projectGroup}"
version = "${applicationVersion}"

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
kotlin {
    jvmToolchain(17)
}